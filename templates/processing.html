{% extends "index.html" %}

{% block title %}Processing · Metro Doc Classifier{% endblock %}

{% block content %}
<h2 class="section-title">Live Queue Monitor</h2>
<div class="panel">
    <table class="table">
        <thead>
            <tr><th>Filename</th><th>Status</th><th>Category</th><th>Confidence</th></tr>
        </thead>
        <tbody id="queueRows">
            <tr><td colspan="4" class="muted">Waiting for queue data...</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% block page_scripts %}
<script>
async function refreshQueue() {
    const rows = document.getElementById('queueRows');
    try {
        const res = await fetch('/file-status');
        if (!res.ok) {
            rows.innerHTML = '<tr><td colspan="4" class="muted">Unable to refresh queue right now.</td></tr>';
            return;
        }
        const statuses = await res.json();
        const items = Object.entries(statuses);
        if (!items.length) {
            rows.innerHTML = '<tr><td colspan="4" class="muted">No files in queue.</td></tr>';
            return;
        }
        rows.innerHTML = items.map(([name, info]) =>
            `<tr><td>${name}</td><td>${info.status || '-'}</td><td>${info.category || '-'}</td><td>${info.confidence || '-'}</td></tr>`
        ).join('');
    } catch (err) {
        rows.innerHTML = '<tr><td colspan="4" class="muted">Unable to refresh queue right now.</td></tr>';
        console.error('Unable to refresh processing queue', err);
    }
}
refreshQueue();
const processingInterval = setInterval(refreshQueue, 1200);
window.addEventListener('beforeunload', () => clearInterval(processingInterval));
</script>
{% endblock %}
