<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Metro Doc Classifier{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c0f;
            --surface: #111418;
            --border: #1e2329;
            --text: #c8d0da;
            --text-dim: #6f7a89;
            --text-bright: #eef1f5;
            --accent: #f5c518;
            --accent-dim: #7a6209;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Barlow Condensed', sans-serif;
            display: grid;
            grid-template-columns: 260px 1fr;
        }

        .sidebar {
            border-right: 1px solid var(--border);
            background: var(--surface);
            padding: 24px 18px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .system-name {
            color: var(--text-bright);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: .04em;
            margin-bottom: 2px;
        }

        .system-sub {
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: .16em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-link {
            color: var(--text);
            text-decoration: none;
            border: 1px solid transparent;
            padding: 10px 12px;
            font-size: 18px;
            letter-spacing: .04em;
        }

        .nav-link:hover { border-color: var(--border); }

        .nav-link.active {
            color: var(--accent);
            border-color: var(--accent-dim);
            background: rgba(245, 197, 24, 0.08);
        }

        .content-wrap {
            min-width: 0;
        }

        .topbar {
            height: 72px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .topbar-title {
            color: var(--text-bright);
            font-size: 28px;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin: 0;
        }

        .topbar-path {
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        main {
            padding: 26px 28px 40px;
        }

        .panel {
            border: 1px solid var(--border);
            background: var(--surface);
            padding: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .metric-label {
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .metric-value {
            color: var(--text-bright);
            font-size: 28px;
            margin-top: 8px;
            letter-spacing: .04em;
        }

        .section-title {
            color: var(--text-bright);
            font-size: 24px;
            margin: 0 0 14px;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .muted { color: var(--text-dim); }

        .btn {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--accent-dim);
            color: var(--accent);
            background: rgba(245, 197, 24, 0.08);
            padding: 9px 12px;
            text-decoration: none;
            cursor: pointer;
            font: inherit;
            letter-spacing: .06em;
            text-transform: uppercase;
            font-size: 13px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        .table th,
        .table td {
            border-top: 1px solid var(--border);
            padding: 9px 8px;
            text-align: left;
        }

        .table th {
            color: var(--text-dim);
            letter-spacing: .12em;
            font-size: 11px;
            text-transform: uppercase;
        }
    </style>
    {% block page_styles %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div class="system-name">Metro Doc Classifier</div>
        <div class="system-sub">Navigation</div>
        <nav class="nav-list">
            <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">Dashboard</a>
            <a class="nav-link {% if request.path == '/upload' %}active{% endif %}" href="/upload">Upload</a>
            <a class="nav-link {% if request.path == '/processing' %}active{% endif %}" href="/processing">Processing</a>
            <a class="nav-link {% if request.path == '/validation' %}active{% endif %}" href="/validation">Validation</a>
            <a class="nav-link {% if request.path == '/documents' %}active{% endif %}" href="/documents">Documents</a>
            <a class="nav-link {% if request.path == '/export' %}active{% endif %}" href="/export">Export</a>
        </nav>
    </aside>

    <div class="content-wrap">
        <header class="topbar">
            <h1 class="topbar-title">Metro Document Operations</h1>
            <div class="topbar-path">{{ request.path }}</div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block page_scripts %}{% endblock %}
</body>
</html>
